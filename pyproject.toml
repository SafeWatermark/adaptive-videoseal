[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AdaptiveVideoseal"
version = "0.1.0"
description = "Adaptive Video Watermark Propagation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "videoseal @ git+https://github.com/facebookresearch/videoseal.git",
    "av>=16.0.1",
    "calflops>=0.3.2",
    "einops>=0.8.1",
    "ffmpeg-python>=0.2.0",
    "ipykernel>=7.1.0",
    "lpips>=0.1.4",
    "matplotlib>=3.10.7",
    "omegaconf>=2.3.0",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "pycocotools>=2.0.10",
    "pytorch-msssim>=1.0.0",
    "pywavelets>=1.9.0",
    "reedsolo>=1.7.0",
    "safetensors>=0.6.2",
    "scikit-image>=0.25.2",
    "scipy>=1.16.3",
    "tensorboard>=2.20.0",
    "timm==0.9.16",
    "torch-dct>=0.1.6",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "albumentations>=2.0.8",
    "onnxruntime>=1.23.2",
    "onnx2torch>=1.5.15",
    "yt-dlp>=2025.11.12",
    "easydict>=1.13",
    "sionna>=0.8.0",
    "tensorflow[and-cuda]>=2.20.0",
]


[tool.setuptools.packages.find]
where = ["src/videoseal", "src/videomarkbench", "src/videomarkbench/REVMark"]

[dependency-groups]
dev = [
    "coverage>=7.11.2",
    "pytest>=8.4.2",
    "ruff>=0.14.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/videoseal/*",
    "src/videomarkbench/*",
]


[tool.ruff]
exclude = [
    "src/videoseal",
    "src/videomarkbench/*",
    "src/notebooks",
    "src/REVMark/__init__.py" # exclude to register system path properly
]

[tool.ruff.lint]
ignore = ["E402"]  # Module level import not at top of file (needed for sys.path manipulation)
